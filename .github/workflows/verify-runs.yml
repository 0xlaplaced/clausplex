name: Verify puzzle runs
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clausplex-verifier
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate nickname replays
        env:
          CLAUS_SCORES_KEY: ${{ secrets.CLAUS_SCORES_KEY }}
        run: node backend/verify-guests.mjs
      - name: Validate previously submitted Claus replays
        env:
          CLAUS_VERIFIER_TOKEN: ${{ secrets.CLAUS_VERIFIER_TOKEN }}
        run: node backend/verify-queue.mjs
